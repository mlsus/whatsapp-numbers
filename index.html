<meta charset="UTF-8">

<title>Random Call Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{

    padding:12px;
}

.container{
    max-width:700px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    border:1px solid #eee;
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ff2f7a;
}

.info{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:700;
    color:#222;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
}

.status{
    font-size:11px;
    padding:2px 7px;
    border-radius:50px;
    font-weight:600;
    background:#e6ffed;
    color:#0a8a2a;
}

.status.offline{
    background:#ffe6e6;
    color:#d60000;
}

.details{
    font-size:13px;
    color:#666;
    margin-top:4px;
    line-height:1.5;
}

.call-wrap{
    display:flex;
    align-items:center;
    gap:10px;
}

.arrow{
    width:18px;
    height:18px;
    animation:move .8s infinite alternate;
}

@keyframes move{
    from{transform:translateX(0);}
    to{transform:translateX(8px);}
}

.call-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#25d366;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 5px 12px rgba(37,211,102,.35);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,.5);}
    70%{box-shadow:0 0 0 12px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
}

@media(max-width:600px){

    body{padding:8px;}

    .card{
        padding:10px;
        gap:10px;
        border-radius:12px;
    }

    .avatar{
        width:55px;
        height:55px;
        border-width:2px;
    }

    .name{font-size:15px;}
    .details{font-size:11px;}

    .status{
        font-size:10px;
        padding:2px 6px;
    }

    .call-btn{
        width:42px;
        height:42px;
    }

    .arrow{
        width:14px;
        height:14px;
    }
}
</style>

function shuffle(arr){
    return arr.sort(() => Math.random() - 0.5);
}

let shuffledImages = shuffle([...images]);

function getImage(){
    if(shuffledImages.length === 0){
        shuffledImages = shuffle([...images]);
    }
    return shuffledImages.pop();
}

// ===== HELP FUNCTION =====
function randomItem(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

const container = document.getElementById("cardsContainer");

for(let i=0;i<10;i++){

    const name = randomItem(names);
    const location = randomItem(locations);
    const age = Math.floor(Math.random()*13)+18;

    const isOffline = offlineIndexes.includes(i);
    const status = isOffline ? "Offline" : "Online";

    const photo = getImage();

    container.innerHTML += `

    }

    .rcw-info{
        display:flex;

        gap:10px;
    }

    .rcw-info img{

    .rcw-text h3{

    .rcw-text p{

        transition:.2s ease;

    }

        width:26px;
        height:26px;
        fill:currentColor;
    }

    .rcw-accept{
        background:#25d366;
    }

    .rcw-reject{
        background:#ff3b30;
    }

    .rcw-reject svg{
        transform:rotate(135deg);
    }

    @keyframes rcwPop{
        from{
            transform:translateY(50px);
            opacity:0;
        }
        to{
            transform:translateY(0);
            opacity:1;

    }

    const names = [

    function randomCaller(){
        return {
            name: names[Math.floor(Math.random() * names.length)],
            pic: pics[Math.floor(Math.random() * pics.length)]
        };
    }

    // ================== CREATE WIDGET ==================
    function createWidget(){

        if(document.querySelector(".rcw-callbar")) return;

        const data = randomCaller();

        const box = document.createElement("div");
        box.className = "rcw-callbar";

        box.innerHTML = `

                    </svg>

        document.body.appendChild(box);

        box.querySelector(".rcw-accept").addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();
            window.location.href = ACCEPT_URL;
        });

        // Reject
        box.querySelector(".rcw-reject").addEventListener("click", function(e){

            e.stopPropagation();

            const randomUrl = rejectPages[
                Math.floor(Math.random() * rejectPages.length)
            ];

            window.location.href = randomUrl;
        });

    // ================== START ==================
    window.addEventListener("load", function(){
        setTimeout(createWidget, 2000);
    });

})();
